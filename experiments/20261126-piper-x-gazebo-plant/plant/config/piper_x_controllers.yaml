# ros2_control controllers for the MVE-1 Piper X Gazebo plant.
#
# gz_ros2_control runs the controller_manager inside Gazebo in the /sim/piper_x
# namespace (see the <ros> block in the generated URDF), so every top-level
# key is fully qualified:
#   /sim/piper_x/controller_manager
#   /sim/piper_x/joint_states
#   /sim/piper_x/arm_controller/follow_joint_trajectory
#   /sim/piper_x/gripper_controller/follow_joint_trajectory
#
# The 6 arm joints and the master gripper joint take position commands. The two
# mimic fingers have state interfaces only; see result.md for whether the
# installed physics engine enforces the mimic relation.
/sim/piper_x/controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

/sim/piper_x/arm_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    open_loop_control: false
    allow_nonzero_velocity_at_trajectory_start: true

/sim/piper_x/gripper_controller:
  ros__parameters:
    joints:
      - gripper

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    open_loop_control: false
    allow_nonzero_velocity_at_trajectory_start: true
